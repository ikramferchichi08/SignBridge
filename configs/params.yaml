experiment_name: signbridge
sequence_length: 32
num_signs: 100
seed: 42
paths:
  raw_data: data/raw
  landmarks: data/landmarks
  processed_data: data/processed
  models: models
dataset:
  name: wlasl
  metadata: data/raw/wlasl/metadata.csv
  split: stratified_group_kfold   # group = signer_id, stratified by sign
  n_folds: 5
extraction:
  max_side: 640          # frames are downscaled before MediaPipe (landmarks are normalized)
  model_complexity: 1    # MediaPipe Holistic: 0 fast, 1 default, 2 accurate
  face: subset           # subset = lips + eyebrows (60 points), none = no face
